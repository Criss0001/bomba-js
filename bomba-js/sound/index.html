<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar Bomba</title>
    <link rel="stylesheet" href="/bomba-js/css/style.css">
</head>
<body>
    <div class="grid"></div>

    <div class="warning"></div>

    <div class="base">
        <button id="activate">
            <span>Activar Bomba</span>
        </button>
    </div>

    <div class="box opened" id="cover">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <span></span><span></span>
    </div>

    <div>
        SELF-&thinsp;DESTRUCT
    </div>

    <div id="panel">
        <div id="msg">DEVICE SELF-DESTRUCTION </div>
        <div id="time">9</div>
        <div id="abort">ABORT</div>
        <span id="detonate">DETONATE</span>
    </div>
    <div id="turn-off"></div>
    <div id="closing"></div>

    <div id="restart"><button id="reload"></button></div>

    <div id="mute"></div>

    <audio id="alarm" scr=""></audio>
    <audio id="alarm2" scr=""></audio>
    <script scr="/prueba.js></script>
</body>
</html>
